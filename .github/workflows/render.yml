name: Render pilot
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npx remotion browser ensure
      - run: mkdir -p out && npm run render
      - uses: actions/upload-artifact@v4
        with:
          name: story-studio-pilot
          path: out/pilot.mp4
          retention-days: 1
