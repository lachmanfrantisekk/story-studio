name: Render pilot
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: story-studio-pilot-render
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ffmpeg + Piper (free, on GitHub runner)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --disable-pip-version-check 'piper-tts>=1.2,<2'
      - name: Download open Czech voice model
        run: |
          mkdir -p .voice-model
          base='https://huggingface.co/rhasspy/piper-voices/resolve/main/cs/cs_CZ/jirka/medium'
          curl --fail --location --retry 3 --silent --show-error "$base/cs_CZ-jirka-medium.onnx" -o .voice-model/cs_CZ-jirka-medium.onnx
          curl --fail --location --retry 3 --silent --show-error "$base/cs_CZ-jirka-medium.onnx.json" -o .voice-model/cs_CZ-jirka-medium.onnx.json
          test "$(wc -c < .voice-model/cs_CZ-jirka-medium.onnx)" -gt 30000000
      - name: Generate Czech voice and original soundtrack
        run: |
          python scripts/generate_voice.py
          python scripts/mix_audio.py
      - name: Render animation on cloud runner
        run: |
          npm install
          npx remotion browser ensure
          mkdir -p out
          npm run render
      - name: Add soundtrack and Czech voice to MP4
        run: |
          ffmpeg -hide_banner -loglevel error -y \
            -i out/pilot.mp4 -i out/soundtrack.wav \
            -map 0:v:0 -map 1:a:0 -c:v copy \
            -c:a aac -b:a 160k -shortest -movflags +faststart out/pilot-final.mp4
          mv out/pilot-final.mp4 out/pilot.mp4
      - name: Verify final MP4 (resolution, fps, duration, audio)
        run: python scripts/check_output.py out/pilot.mp4
      - name: Generate cover and Czech posting text
        run: |
          ffmpeg -hide_banner -loglevel error -y -ss 26 \
            -i out/pilot.mp4 -frames:v 1 -q:v 3 out/cover.jpg
          python scripts/create_exports.py
          test -s out/cover.jpg
          test -s out/popisek.txt
      - uses: actions/upload-artifact@v4
        with:
          name: story-studio-pilot-a2-cz
          path: |
            out/pilot.mp4
            out/cover.jpg
            out/popisek.txt
          retention-days: 1
          if-no-files-found: error
